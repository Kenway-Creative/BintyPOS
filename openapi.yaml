openapi: 3.0.3
info:
  title: BintyPOS API
  version: 0.2.17
  description: Proposed open API contract, not an operational endpoint. Prototype data only. Query filters do not grant permissions. SQLite v0.2.17 adds a pure trusted-server outlet permission policy (no verified principal or HTTP enforcement); v0.2.16 adds trusted mock-only manual review notes (no HTTP endpoint, verified actor or order/payment mutation); v0.2.15 adds an internal mock-only reconciliation snapshot (no HTTP endpoint, dispatcher, gateway or automatic payment decision); v0.2.14 serialises internal capability validation and checkout mutation in one SQLite writer transaction; v0.2.13 adds mock-only trusted recovery inspection and v0.2.12 adds an internal, hashed bearer-capability facade for venue-scoped staff/QR mock checkout. It is NOT human/device authentication, OAuth, an HTTP listener, or live payment integration.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: API health probe
      operationId: health
      responses:
        '200':
          description: Available
  /venues/{venueId}/catalog:
    get:
      summary: Published catalogue projected for a sales area
      operationId: listCatalog
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: query, required: true, schema: {type: string}}
        - name: channel
          in: query
          required: false
          schema: {type: string, enum: [staff, guest], default: staff}
          description: Projection context; must be validated against server identity and published area policy.
        - name: outletId
          in: query
          required: false
          schema: {type: string}
          description: Optional staff-only navigation filter; never an authorisation grant.
      responses:
        '200':
          description: Catalogue version and products
          content:
            application/json:
              schema:
                type: object
                required: [version, products]
                properties:
                  version: {type: string}
                  keyboardVersion: {type: integer, minimum: 1, description: Published area keyboard version}
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
  /venues/{venueId}/quotes:
    post:
      summary: Validate a basket against the published catalogue and issue a server-priced quote
      operationId: createBasketQuote
      security: [{checkoutAuth: []}]
      description: Planned server endpoint. v0.2.10 internal Python create_quote() accepts ONLY productId and quantity, calculates GBP-pence subtotal and ingredient demand from persisted product versions and recipes; taxes, area permissions, authenticated sessions and HTTP endpoint are NOT implemented. Browser quote fields remain advisory only.
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BasketQuoteRequest'}
      responses:
        '200':
          description: Authoritative quote with unchanged prices or review conflicts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BasketQuote'}
        '409': {description: Unavailable product, stale catalogue or invalid area policy}
  /venues/{venueId}/quotes/{quoteId}/accept-prices:
    post:
      summary: Explicitly accept a revised server-priced quote
      operationId: acceptBasketQuotePrices
      security: [{checkoutAuth: []}]
      description: Planned endpoint. v0.2.10 internal accept_quote() checks checkout session fixture, expected server total, expiry and published product versions, and persists accepted state. No HTTP endpoint, verified identity, revision increment, VAT or payment processing yet.
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Expected current quote revision}
      responses:
        '200':
          description: Newly accepted server quote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BasketQuote'}
        '409': {description: Stale quote, changed catalogue or unavailable item}
  /venues/{venueId}/inventory/stockrooms:
    get:
      summary: List logical virtual stockrooms and physical count breakdowns
      operationId: listVirtualStockrooms
      description: Planned read-only projection. Logical stockrooms are categories; physical count locations are independent. Authorise by verified venue scope.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Logical pools and ingredient counts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/VirtualStockroom'}
        '403': {description: Stockroom access denied}
  /venues/{venueId}/inventory/counts:
    post:
      summary: Submit a physical-location ingredient count for review
      operationId: submitPhysicalStockCount
      description: Future server-only operation. Validate verified actor and physical location; require revision match, durable audit and reconciliation workflow. Not implemented by demo +/- buttons.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Expected inventory revision}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhysicalCountInput'}
      responses:
        '202': {description: Physical count submitted for reconciliation}
        '403': {description: Count permission denied}
        '409': {description: Stale stock revision}
  /venues/{venueId}/inventory/items/{ingredientId}/room:
    put:
      summary: Reclassify ingredient into another logical stockroom
      operationId: reassignIngredientStockroom
      description: Future admin-only reclassification preserving physical counts and item identity. Must be audited and revision-checked.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: ingredientId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId]
              properties:
                roomId: {type: string}
      responses:
        '200': {description: Ingredient reclassified; physical counts preserved}
        '403': {description: Venue administrator required}
        '409': {description: Stale revision}
  /venues/{venueId}/inventory/preflight:
    post:
      summary: Preview shared ingredient demand for an accepted server quote
      operationId: preflightInventory
      description: Planned server-only endpoint. Derive recipes, stock pool and counts from trusted inventory; never trust client-supplied stock or ingredient demand. A successful preflight is NOT a reservation and cannot guarantee stock at checkout.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, quoteRevision]
              properties:
                quoteId: {type: string}
                quoteRevision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Aggregate ingredient demand and any shortages for the current inventory snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryPreflight'}
        '403': {description: Authenticated user cannot inspect venue stock}
        '409': {description: Quote stale or no longer accepted}
  /venues/{venueId}/inventory/reservations:
    post:
      summary: Reserve recipe stock for an accepted authoritative quote
      operationId: reserveInventoryForQuote
      description: Planned authenticated server transaction. The internal SQLite v0.2.10 TrustedQuoteReservations.reserve_accepted_quote() atomically checks accepted quote, session fixture, expiry and current product versions, derives demands from the persisted quote, and creates an idempotent stock hold. NO HTTP endpoint, real authentication, order ledger or payment coordination. The older direct-demand SQLiteReservations.reserve() remains trusted test-only. Browser demo is NOT a multi-device lock.
      security: [{checkoutAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReserveQuoteStock'}
      responses:
        '201':
          description: Held stock with server-assigned expiry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReservationRecord'}
        '200': {description: Idempotent replay without an additional hold}
        '403': {description: Checkout session cannot access venue or quote}
        '409': {description: Stale quote, shortage or conflicting idempotency key}
  /venues/{venueId}/inventory/reservations/{reservationId}:
    get:
      summary: Check reservation for the authenticated checkout session
      operationId: getInventoryReservation
      security: [{checkoutAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: reservationId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current reservation state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReservationRecord'}
        '403': {description: Checkout session not authorised}
        '404': {description: Unknown reservation}
    delete:
      summary: Release uncommitted stock hold
      operationId: releaseInventoryReservation
      security: [{checkoutAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: reservationId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Released or already released
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReservationRecord'}
        '403': {description: Checkout session not authorised}
        '409': {description: Already committed}
  /venues/{venueId}/inventory/reservations/{reservationId}/commit:
    post:
      summary: Internal trusted order transition consumes reserved stock once
      operationId: commitInventoryReservation
      description: Service-to-service only. Real system must commit stock movements, order state and idempotency atomically, coordinated with verified payment state. No Dojo connection.
      security: [{serviceAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: reservationId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Committed or replay of prior commit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReservationRecord'}
        '403': {description: Trusted service authentication required}
        '409': {description: Expired, released or conflicted reservation}
  /venues/{venueId}/orders:
    post:
      summary: Submit validated multi-vendor order once
      description: Planned transactional endpoint. Server must verify an accepted, unexpired authoritative quote, atomically reserve stock, enforce Idempotency-Key and confirm payment through a separate trusted adapter. No live payment integration exists.
      operationId: submitOrder
      security: [{checkoutAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaId, quoteId, quoteRevision]
              properties:
                areaId: {type: string}
                quoteId: {type: string}
                quoteRevision: {type: integer, minimum: 1}
      responses:
        '202': {description: Order accepted pending payment confirmation}
        '409': {description: Expired quote, stock, catalogue or idempotency conflict}
  /venues/{venueId}/areas/{areaId}/keyboard:
    get:
      summary: Fetch the published keyboard profile for a selling area
      operationId: getPublishedKeyboard
      description: Planned endpoint. The published version is what tills and QR must consume.
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Published keyboard profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyboardProfile'}
        '404': {description: Area not found}
  /venues/{venueId}/areas/{areaId}/keyboard/draft:
    get:
      summary: Fetch unpublished area keyboard draft
      operationId: getKeyboardDraft
      description: Future server-side permission required; demo PIN is not authorisation.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Pending draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyboardDraft'}
        '403': {description: Insufficient venue management scope}
        '404': {description: No pending draft}
    put:
      summary: Save draft without changing live keyboard
      operationId: saveKeyboardDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KeyboardDraftInput'}
      responses:
        '200':
          description: Draft saved, not published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyboardDraft'}
        '403': {description: Insufficient venue management scope}
        '422': {description: Invalid or unknown outlet selection}
    delete:
      summary: Discard unpublished area keyboard draft
      operationId: discardKeyboardDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Draft discarded}
        '403': {description: Insufficient venue management scope}
  /venues/{venueId}/areas/{areaId}/keyboard/publish:
    post:
      summary: Atomically publish a staged keyboard version
      operationId: publishKeyboard
      description: Future server operation. Must compare expected version and record publisher identity.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Expected current published version}
      responses:
        '200':
          description: Newly published keyboard
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyboardProfile'}
        '403': {description: Insufficient venue management scope}
        '409': {description: Version conflict or missing draft}
  /venues/{venueId}/areas/{areaId}/shortcuts:
    get:
      summary: Fetch published staff-only speed shortcuts for a selling area
      operationId: getPublishedShortcuts
      description: Proposed endpoint. Return only published settings. Client must intersect shortcuts with published keyboard/catalogue visibility.
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Published shortcut configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortcutProfile'}
        '404': {description: Unknown area}
  /venues/{venueId}/areas/{areaId}/shortcuts/draft:
    get:
      summary: Fetch unpublished speed shortcut draft
      operationId: getShortcutDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Unpublished shortcut draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortcutDraft'}
        '403': {description: Venue-admin access required}
        '404': {description: No draft}
    put:
      summary: Stage speed shortcut draft without changing live tills
      operationId: saveShortcutDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShortcutDraftInput'}
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortcutDraft'}
        '403': {description: Venue-admin access required}
        '422': {description: Invalid, duplicate or excessive shortcut selection}
    delete:
      summary: Discard unpublished speed shortcut draft
      operationId: discardShortcutDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Draft discarded}
        '403': {description: Venue-admin access required}
  /venues/{venueId}/areas/{areaId}/shortcuts/publish:
    post:
      summary: Publish shortcut draft with optimistic version check
      operationId: publishShortcuts
      description: Future server must enforce venue admin scope and atomically persist/audit a published version.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Expected shortcut version}
      responses:
        '200':
          description: Newly published shortcut profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortcutProfile'}
        '403': {description: Venue-admin access required}
        '409': {description: Missing draft or version conflict}
  /venues/{venueId}/outlets/{outletId}/products/{productId}/proposal:
    post:
      summary: Stage a scoped outlet offering proposal for central approval
      operationId: stageOfferingProposal
      description: Planned server endpoint. Derive outlet manager scope from verified identity; do not trust outletId alone. Price is GBP pence on the wire.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: outletId, in: path, required: true, schema: {type: string}}
        - {name: productId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfferingPatch'}
      responses:
        '201':
          description: Pending proposal; published catalogue unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferingProposal'}
        '403': {description: Outlet scope denied}
        '404': {description: Product or outlet unknown}
        '409': {description: Existing pending proposal}
        '422': {description: Invalid or unchanged proposal}
    delete:
      summary: Discard own pending proposal (or venue admin)
      operationId: discardOfferingProposal
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: outletId, in: path, required: true, schema: {type: string}}
        - {name: productId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Pending proposal discarded}
        '403': {description: Scope or proposal ownership denied}
        '404': {description: No pending proposal}
  /venues/{venueId}/offering-proposals:
    get:
      summary: Venue-admin review queue
      operationId: listOfferingProposals
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Pending proposals
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OfferingProposal'}
        '403': {description: Venue approval permission required}
  /venues/{venueId}/offering-proposals/{productId}/publish:
    post:
      summary: Approve and atomically publish one pending offering
      operationId: publishOfferingProposal
      description: Planned server transaction must compare current product version, enforce venue approval scope, persist immutable audit and distribute catalogue revision to staff and QR.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: productId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Expected published product version}
      responses:
        '200':
          description: Newly published offering
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedOffering'}
        '403': {description: Venue approval permission required}
        '404': {description: No pending proposal}
        '409': {description: Stale version conflict}
  /venues/{venueId}/offering-proposals/{productId}/reject:
    post:
      summary: Reject pending offering proposal without publishing
      operationId: rejectOfferingProposal
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: productId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Rejected and audited}
        '403': {description: Venue approval permission required}
        '404': {description: No pending proposal}
  /venues/{venueId}/orders/{orderId}/lifecycle:
    get:
      summary: Proposed server-authorised order lifecycle view (not implemented)
      operationId: getOrderLifecycle
      description: Python v0.2.12 demo facade derives session and venue from a hashed bearer capability; real HTTP must verify staff/device identity and enforce auth atomically with writes. No mock payment methods are HTTP endpoints.
      security: [{checkoutAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: orderId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Future durable order status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderLifecycle'}
        '401': {description: Missing verified checkout identity}
        '403': {description: Venue or order scope denied}
        '404': {description: Unknown order}
components:
  securitySchemes:
    managerAuth:
      type: http
      scheme: bearer
      description: Planned server-side manager authentication, NOT implemented in prototype.
    checkoutAuth:
      type: http
      scheme: bearer
      description: Proposed bearer checkout credential. v0.2.12 Python SQLite fixture facade uses random hashed, expiring, revocable venue-bound tokens; NO HTTP authentication, verified human/device identity, TLS or login endpoint exists.
    serviceAuth:
      type: http
      scheme: bearer
      description: Proposed trusted internal service identity. Never expose to browsers.
  schemas:
    OrderLifecycle:
      type: object
      description: Proposed read-only server view; no payment operation is implemented. State authorised in Python means MOCK authorisation only.
      required: [orderId, quoteId, status, totalMinor]
      properties:
        orderId: {type: string}
        quoteId: {type: string}
        totalMinor: {type: integer, minimum: 0, description: GBP pence; no VAT/tax/discount engine}
        status: {type: string, enum: [awaiting_payment, authorised, confirmed, failed, released, expired, needs_reconciliation]}
        reason: {type: string, nullable: true}
    ReserveQuoteStock:
      type: object
      required: [quoteId, quoteRevision]
      additionalProperties: false
      description: No client-supplied ingredient demand, stock count or TTL. The v0.2.10 Python adapter takes quoteId and a trusted session fixture; HTTP quoteRevision and authenticated identity are future contract features.
      properties:
        quoteId: {type: string}
        quoteRevision: {type: integer, minimum: 1}
    ReservationRecord:
      type: object
      required: [reservationId, quoteId, status, expiresAt]
      properties:
        reservationId: {type: string}
        quoteId: {type: string}
        status: {type: string, enum: [held, committed, released, expired, conflicted]}
        expiresAt: {type: string, format: date-time}
        committedAt: {type: string, format: date-time}
    VirtualStockroom:
      type: object
      required: [id, name, ingredients]
      properties:
        id: {type: string, description: Logical category identifier, NOT a physical location}
        name: {type: string}
        ingredients:
          type: array
          items:
            type: object
            required: [ingredientId, total, physicalCounts]
            properties:
              ingredientId: {type: string}
              total: {type: integer, minimum: 0}
              physicalCounts:
                type: array
                items:
                  type: object
                  required: [locationId, quantity]
                  properties:
                    locationId: {type: string}
                    quantity: {type: integer, minimum: 0}
    PhysicalCountInput:
      type: object
      required: [ingredientId, locationId, countedQuantity]
      properties:
        ingredientId: {type: string}
        locationId: {type: string, description: Real physical counting location, not logical room}
        countedQuantity: {type: integer, minimum: 0, description: Demo integer units only; production requires UOM and timestamps}
        note: {type: string, maxLength: 500}
    InventoryPreflight:
      type: object
      required: [ok, quoteId, quoteRevision, stockRevision, demands, shortages]
      description: Advisory inventory snapshot only. Order submission must atomically recheck and reserve inventory with idempotency.
      properties:
        ok: {type: boolean}
        quoteId: {type: string}
        quoteRevision: {type: integer, minimum: 1}
        stockRevision: {type: string, description: Opaque inventory revision for diagnostics, not a reservation}
        demands:
          type: array
          items:
            type: object
            required: [ingredientId, required]
            properties:
              ingredientId: {type: string}
              required: {type: integer, minimum: 1, description: Demo integer units; production quantities need units of measure}
        shortages:
          type: array
          items:
            type: object
            required: [ingredientId, required, available]
            properties:
              ingredientId: {type: string}
              required: {type: integer, minimum: 1}
              available: {type: integer, minimum: 0}
    BasketQuoteRequest:
      type: object
      required: [areaId, lines]
      properties:
        areaId: {type: string}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity, productVersion, unitPriceMinor]
            properties:
              productId: {type: string}
              quantity: {type: integer, minimum: 1}
              productVersion: {type: integer, minimum: 1}
              unitPriceMinor: {type: integer, minimum: 0, description: Client-displayed GBP pence; server must not trust this price}
    BasketQuote:
      type: object
      required: [quoteId, revision, currency, lines, subtotalMinor, conflicts]
      properties:
        quoteId: {type: string}
        revision: {type: integer, minimum: 1}
        currency: {type: string, enum: [GBP]}
        subtotalMinor: {type: integer, minimum: 0, description: Server-authoritative subtotal in pence, excluding separately calculated taxes and adjustments}
        lines:
          type: array
          items: {$ref: '#/components/schemas/BasketLineSnapshot'}
        conflicts:
          type: array
          items: {$ref: '#/components/schemas/BasketConflict'}
    BasketLineSnapshot:
      type: object
      required: [productId, productVersion, vendorId, name, unitPriceMinor, quantity]
      properties:
        productId: {type: string}
        productVersion: {type: integer, minimum: 1}
        vendorId: {type: string}
        name: {type: string}
        unitPriceMinor: {type: integer, minimum: 0}
        quantity: {type: integer, minimum: 1}
    BasketConflict:
      type: object
      required: [productId, code]
      properties:
        productId: {type: string}
        code: {type: string, enum: [CATALOGUE_CHANGED, PRODUCT_UNAVAILABLE, PRODUCT_REMOVED]}
        fromVersion: {type: integer, minimum: 1}
        toVersion: {type: integer, minimum: 1}
        fromPriceMinor: {type: integer, minimum: 0}
        toPriceMinor: {type: integer, minimum: 0}
    KeyboardDraftInput:
      type: object
      required: [kind, vendors]
      properties:
        kind: {type: string, enum: [all, short, vendors]}
        vendors:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Required non-empty for kind vendors; empty otherwise.
    KeyboardDraft:
      allOf:
        - {$ref: '#/components/schemas/KeyboardDraftInput'}
        - type: object
          required: [baseVersion]
          properties:
            baseVersion: {type: integer, minimum: 1}
    KeyboardProfile:
      allOf:
        - {$ref: '#/components/schemas/KeyboardDraftInput'}
        - type: object
          required: [version]
          properties:
            version: {type: integer, minimum: 1}

    ShortcutDraftInput:
      type: object
      required: [productIds, categories]
      properties:
        productIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string}
          description: Ordered product IDs for staff-only one-tap favourites.
        categories:
          type: array
          maxItems: 6
          uniqueItems: true
          items: {type: string}
          description: Ordered staff-only category jump labels.
    ShortcutDraft:
      allOf:
        - {$ref: '#/components/schemas/ShortcutDraftInput'}
        - type: object
          required: [baseVersion]
          properties:
            baseVersion: {type: integer, minimum: 1}
    ShortcutProfile:
      allOf:
        - {$ref: '#/components/schemas/ShortcutDraftInput'}
        - type: object
          required: [version]
          properties:
            version: {type: integer, minimum: 1}
    OfferingPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Product name, availability and centrally approved price changes only.
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        priceMinor: {type: integer, minimum: 0, maximum: 10000000, description: GBP pence, not a floating-point pound value}
        available: {type: boolean}
    OfferingProposal:
      type: object
      required: [productId, outletId, baseVersion, changes, requestedBy, status]
      properties:
        productId: {type: string}
        outletId: {type: string}
        baseVersion: {type: integer, minimum: 1}
        changes: {$ref: '#/components/schemas/OfferingPatch'}
        requestedBy: {type: string}
        status: {type: string, enum: [pending]}
    PublishedOffering:
      type: object
      required: [productId, version, name, priceMinor, available]
      properties:
        productId: {type: string}
        version: {type: integer, minimum: 1}
        name: {type: string}
        priceMinor: {type: integer, minimum: 0}
        available: {type: boolean}
    Product:
      type: object
      required: [id, businessId, name, priceMinor]
      properties:
        id: {type: string}
        businessId: {type: string}
        name: {type: string}
        categoryId: {type: string}
        priceMinor: {type: integer, minimum: 0, description: GBP pence}
        available: {type: boolean}
