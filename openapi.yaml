openapi: 3.0.3
info:
  title: BintyPOS API
  version: 0.2.4
  description: Proposed open API contract, not an operational endpoint. Prototype data only. Query filters do not grant permissions.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: API health probe
      operationId: health
      responses:
        '200':
          description: Available
  /venues/{venueId}/catalog:
    get:
      summary: Published catalogue projected for a sales area
      operationId: listCatalog
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: query, required: true, schema: {type: string}}
        - name: channel
          in: query
          required: false
          schema: {type: string, enum: [staff, guest], default: staff}
          description: Projection context; must be validated against server identity and published area policy.
        - name: outletId
          in: query
          required: false
          schema: {type: string}
          description: Optional staff-only navigation filter; never an authorisation grant.
      responses:
        '200':
          description: Catalogue version and products
          content:
            application/json:
              schema:
                type: object
                required: [version, products]
                properties:
                  version: {type: string}
                  keyboardVersion: {type: integer, minimum: 1, description: Published area keyboard version}
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
  /venues/{venueId}/orders:
    post:
      summary: Submit validated multi-vendor order once
      description: Future transactional endpoint. Idempotency key and stock reservation required.
      operationId: submitOrder
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaId, lines]
              properties:
                areaId: {type: string}
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: {type: string}
                      quantity: {type: integer, minimum: 1}
      responses:
        '202':
          description: Order accepted pending payment confirmation
        '409':
          description: Stock, menu-version or idempotency conflict
  /venues/{venueId}/areas/{areaId}/keyboard:
    get:
      summary: Fetch the published keyboard profile for a selling area
      operationId: getPublishedKeyboard
      description: Planned endpoint. The published version is what tills and QR must consume.
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Published keyboard profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyboardProfile'}
        '404': {description: Area not found}
  /venues/{venueId}/areas/{areaId}/keyboard/draft:
    get:
      summary: Fetch unpublished area keyboard draft
      operationId: getKeyboardDraft
      description: Future server-side permission required; demo PIN is not authorisation.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Pending draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyboardDraft'}
        '403': {description: Insufficient venue management scope}
        '404': {description: No pending draft}
    put:
      summary: Save draft without changing live keyboard
      operationId: saveKeyboardDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KeyboardDraftInput'}
      responses:
        '200':
          description: Draft saved, not published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyboardDraft'}
        '403': {description: Insufficient venue management scope}
        '422': {description: Invalid or unknown outlet selection}
    delete:
      summary: Discard unpublished area keyboard draft
      operationId: discardKeyboardDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Draft discarded}
        '403': {description: Insufficient venue management scope}
  /venues/{venueId}/areas/{areaId}/keyboard/publish:
    post:
      summary: Atomically publish a staged keyboard version
      operationId: publishKeyboard
      description: Future server operation. Must compare expected version and record publisher identity.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Expected current published version}
      responses:
        '200':
          description: Newly published keyboard
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyboardProfile'}
        '403': {description: Insufficient venue management scope}
        '409': {description: Version conflict or missing draft}
  /venues/{venueId}/areas/{areaId}/shortcuts:
    get:
      summary: Fetch published staff-only speed shortcuts for a selling area
      operationId: getPublishedShortcuts
      description: Proposed endpoint. Return only published settings. Client must intersect shortcuts with published keyboard/catalogue visibility.
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Published shortcut configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortcutProfile'}
        '404': {description: Unknown area}
  /venues/{venueId}/areas/{areaId}/shortcuts/draft:
    get:
      summary: Fetch unpublished speed shortcut draft
      operationId: getShortcutDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Unpublished shortcut draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortcutDraft'}
        '403': {description: Venue-admin access required}
        '404': {description: No draft}
    put:
      summary: Stage speed shortcut draft without changing live tills
      operationId: saveShortcutDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShortcutDraftInput'}
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortcutDraft'}
        '403': {description: Venue-admin access required}
        '422': {description: Invalid, duplicate or excessive shortcut selection}
    delete:
      summary: Discard unpublished speed shortcut draft
      operationId: discardShortcutDraft
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Draft discarded}
        '403': {description: Venue-admin access required}
  /venues/{venueId}/areas/{areaId}/shortcuts/publish:
    post:
      summary: Publish shortcut draft with optimistic version check
      operationId: publishShortcuts
      description: Future server must enforce venue admin scope and atomically persist/audit a published version.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: areaId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Expected shortcut version}
      responses:
        '200':
          description: Newly published shortcut profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShortcutProfile'}
        '403': {description: Venue-admin access required}
        '409': {description: Missing draft or version conflict}
  /venues/{venueId}/outlets/{outletId}/products/{productId}/proposal:
    post:
      summary: Stage a scoped outlet offering proposal for central approval
      operationId: stageOfferingProposal
      description: Planned server endpoint. Derive outlet manager scope from verified identity; do not trust outletId alone. Price is GBP pence on the wire.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: outletId, in: path, required: true, schema: {type: string}}
        - {name: productId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfferingPatch'}
      responses:
        '201':
          description: Pending proposal; published catalogue unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferingProposal'}
        '403': {description: Outlet scope denied}
        '404': {description: Product or outlet unknown}
        '409': {description: Existing pending proposal}
        '422': {description: Invalid or unchanged proposal}
    delete:
      summary: Discard own pending proposal (or venue admin)
      operationId: discardOfferingProposal
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: outletId, in: path, required: true, schema: {type: string}}
        - {name: productId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Pending proposal discarded}
        '403': {description: Scope or proposal ownership denied}
        '404': {description: No pending proposal}
  /venues/{venueId}/offering-proposals:
    get:
      summary: Venue-admin review queue
      operationId: listOfferingProposals
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Pending proposals
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OfferingProposal'}
        '403': {description: Venue approval permission required}
  /venues/{venueId}/offering-proposals/{productId}/publish:
    post:
      summary: Approve and atomically publish one pending offering
      operationId: publishOfferingProposal
      description: Planned server transaction must compare current product version, enforce venue approval scope, persist immutable audit and distribute catalogue revision to staff and QR.
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: productId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: Expected published product version}
      responses:
        '200':
          description: Newly published offering
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedOffering'}
        '403': {description: Venue approval permission required}
        '404': {description: No pending proposal}
        '409': {description: Stale version conflict}
  /venues/{venueId}/offering-proposals/{productId}/reject:
    post:
      summary: Reject pending offering proposal without publishing
      operationId: rejectOfferingProposal
      security: [{managerAuth: []}]
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: productId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Rejected and audited}
        '403': {description: Venue approval permission required}
        '404': {description: No pending proposal}
components:
  securitySchemes:
    managerAuth:
      type: http
      scheme: bearer
      description: Planned server-side manager authentication, NOT implemented in prototype.
  schemas:
    KeyboardDraftInput:
      type: object
      required: [kind, vendors]
      properties:
        kind: {type: string, enum: [all, short, vendors]}
        vendors:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Required non-empty for kind vendors; empty otherwise.
    KeyboardDraft:
      allOf:
        - {$ref: '#/components/schemas/KeyboardDraftInput'}
        - type: object
          required: [baseVersion]
          properties:
            baseVersion: {type: integer, minimum: 1}
    KeyboardProfile:
      allOf:
        - {$ref: '#/components/schemas/KeyboardDraftInput'}
        - type: object
          required: [version]
          properties:
            version: {type: integer, minimum: 1}

    ShortcutDraftInput:
      type: object
      required: [productIds, categories]
      properties:
        productIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string}
          description: Ordered product IDs for staff-only one-tap favourites.
        categories:
          type: array
          maxItems: 6
          uniqueItems: true
          items: {type: string}
          description: Ordered staff-only category jump labels.
    ShortcutDraft:
      allOf:
        - {$ref: '#/components/schemas/ShortcutDraftInput'}
        - type: object
          required: [baseVersion]
          properties:
            baseVersion: {type: integer, minimum: 1}
    ShortcutProfile:
      allOf:
        - {$ref: '#/components/schemas/ShortcutDraftInput'}
        - type: object
          required: [version]
          properties:
            version: {type: integer, minimum: 1}
    OfferingPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Product name, availability and centrally approved price changes only.
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        priceMinor: {type: integer, minimum: 0, maximum: 10000000, description: GBP pence, not a floating-point pound value}
        available: {type: boolean}
    OfferingProposal:
      type: object
      required: [productId, outletId, baseVersion, changes, requestedBy, status]
      properties:
        productId: {type: string}
        outletId: {type: string}
        baseVersion: {type: integer, minimum: 1}
        changes: {$ref: '#/components/schemas/OfferingPatch'}
        requestedBy: {type: string}
        status: {type: string, enum: [pending]}
    PublishedOffering:
      type: object
      required: [productId, version, name, priceMinor, available]
      properties:
        productId: {type: string}
        version: {type: integer, minimum: 1}
        name: {type: string}
        priceMinor: {type: integer, minimum: 0}
        available: {type: boolean}
    Product:
      type: object
      required: [id, businessId, name, priceMinor]
      properties:
        id: {type: string}
        businessId: {type: string}
        name: {type: string}
        categoryId: {type: string}
        priceMinor: {type: integer, minimum: 0, description: GBP pence}
        available: {type: boolean}
